<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pamphlet</title>
    <style>
      :root {
        --page-ratio: 0.707;
        --spread-ratio: 1.414;
        color-scheme: light;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #221b16;
        background: #cabda9;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        grid-template-rows: auto 1fr auto;
        background:
          radial-gradient(ellipse at 50% 68%, rgba(40, 29, 21, 0.24), transparent 38%),
          radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.55), transparent 32%),
          linear-gradient(120deg, rgba(105, 75, 45, 0.2), transparent 42%),
          #cabda9;
        user-select: none;
      }

      header,
      footer {
        position: relative;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 14px;
        background: rgba(247, 244, 238, 0.78);
        backdrop-filter: blur(12px);
      }

      header {
        border-bottom: 1px solid rgba(70, 51, 36, 0.18);
      }

      footer {
        border-top: 1px solid rgba(70, 51, 36, 0.18);
      }

      h1 {
        margin: 0;
        overflow: hidden;
        font-size: 16px;
        font-weight: 650;
        line-height: 1.3;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .toolbar button.active {
        background: #e8efff;
        border-color: rgba(37, 99, 235, 0.55);
      }

      button,
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 34px;
        border: 1px solid rgba(93, 74, 55, 0.4);
        border-radius: 6px;
        padding: 7px 10px;
        color: #221b16;
        font: inherit;
        font-size: 14px;
        line-height: 1;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.86);
      }

      button {
        min-width: 42px;
        cursor: pointer;
      }

      button:hover,
      a:hover {
        background: #ffffff;
      }

      button:disabled {
        cursor: default;
        opacity: 0.4;
      }

      .counter {
        min-width: 104px;
        text-align: center;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }

      main {
        position: relative;
        display: grid;
        min-height: 0;
        padding: 22px;
        place-items: center;
      }

      .stage {
        position: relative;
        width: min(92vw, calc(78vh * var(--spread-ratio)), 1220px);
        aspect-ratio: var(--spread-ratio) / 1;
        perspective: 2400px;
      }

      .stage::before {
        position: absolute;
        inset: auto 4% -26px;
        height: 56px;
        border-radius: 999px;
        background: radial-gradient(ellipse at center, rgba(35, 25, 18, 0.38), transparent 68%);
        content: "";
        filter: blur(2px);
      }

      .book {
        position: absolute;
        inset: 0;
        display: grid;
        transform-style: preserve-3d;
      }

      .cover-board {
        position: absolute;
        inset: -10px;
        border-radius: 10px;
        background:
          linear-gradient(90deg, #714036 0 49.4%, #4b2924 49.4% 50.6%, #714036 50.6% 100%);
        box-shadow:
          inset 0 0 0 1px rgba(36, 23, 17, 0.34),
          inset 0 -12px 18px rgba(35, 22, 16, 0.22),
          0 30px 42px rgba(36, 27, 20, 0.22);
      }

      .spread {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        transform-style: preserve-3d;
      }

      .spread.enter-next .page.left,
      .spread.enter-prev .page.left,
      .spread.enter-next.back-cover .page,
      .spread.enter-prev.back-cover .page,
      .spread.enter-next.cover .page,
      .spread.enter-prev.cover .page {
        animation: page-enter-front 420ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
        transform-origin: right center;
        will-change: transform, opacity, filter;
      }

      .spread.enter-next .page.right,
      .spread.enter-prev .page.right {
        animation: page-enter-back 420ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
        transform-origin: left center;
        will-change: transform, opacity, filter;
      }

      .spread.enter-prev .page.left {
        transform-origin: right center;
      }

      .spread.enter-prev .page.right {
        transform-origin: left center;
      }

      .spread.base {
        z-index: 1;
      }

      .spread.single {
        grid-template-columns: minmax(280px, 0.5fr);
        justify-content: center;
      }

      .spread.cover,
      .spread.back-cover {
        grid-template-columns: 1fr 1fr;
        justify-content: stretch;
      }

      .spread.cover .page {
        grid-column: 2;
        border-radius: 2px 10px 10px 2px;
      }

      .spread.back-cover .page {
        grid-column: 1;
        border-radius: 10px 2px 2px 10px;
      }

      .page {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(90, 70, 48, 0.28);
        background: #fffdfa;
        box-shadow:
          0 2px 0 #eee5d6,
          0 4px 0 #ddd1be,
          0 20px 36px rgba(45, 35, 25, 0.2);
        transform: translateZ(2px);
      }

      .page.left {
        border-radius: 8px 1px 1px 8px;
        box-shadow:
          inset -28px 0 38px rgba(47, 36, 26, 0.15),
          0 2px 0 #eee5d6,
          0 4px 0 #ddd1be,
          0 20px 36px rgba(45, 35, 25, 0.2);
      }

      .page.right {
        border-left: 0;
        border-radius: 1px 8px 8px 1px;
        box-shadow:
          inset 28px 0 38px rgba(47, 36, 26, 0.15),
          0 2px 0 #eee5d6,
          0 4px 0 #ddd1be,
          0 20px 36px rgba(45, 35, 25, 0.2);
      }

      .spread.single .page {
        border-radius: 8px;
      }

      .page::before {
        position: absolute;
        inset: 0;
        z-index: 2;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.18), transparent 12%, transparent 88%, rgba(52, 38, 27, 0.1)),
          linear-gradient(0deg, rgba(224, 214, 197, 0.14), transparent 12%, transparent 88%, rgba(224, 214, 197, 0.14));
        content: "";
        pointer-events: none;
      }

      .page.edge-left::after,
      .page.edge-right::after {
        position: absolute;
        top: 0;
        bottom: 0;
        z-index: 3;
        width: 14px;
        background: repeating-linear-gradient(
          to bottom,
          rgba(112, 90, 65, 0.18) 0 1px,
          transparent 1px 4px
        );
        content: "";
        opacity: 0.75;
        pointer-events: none;
      }

      .page.edge-left::after {
        left: 3px;
      }

      .page.edge-right::after {
        right: 3px;
      }

      .gutter {
        position: absolute;
        inset: 0;
        z-index: 6;
        background:
          linear-gradient(90deg, transparent 0 48.1%, rgba(35, 25, 18, 0.32) 49.25%, rgba(255, 255, 255, 0.36) 50%, rgba(35, 25, 18, 0.25) 50.8%, transparent 52.2%);
        pointer-events: none;
      }

      img {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        -webkit-user-drag: none;
        user-drag: none;
      }

      .page-surface {
        position: absolute;
        inset: 0;
        display: block;
        background:
          linear-gradient(90deg, rgba(224, 214, 197, 0.18), transparent 14%, transparent 86%, rgba(224, 214, 197, 0.12)),
          #fffdfa;
        color: #7b6a5c;
        font-size: 13px;
      }

      .page-surface img {
        background: #fffdfa;
      }

      .page-loading {
        grid-area: 1 / 1;
        z-index: 1;
      }

      .page-label {
        position: absolute;
        right: 8px;
        bottom: 8px;
        z-index: 4;
        border-radius: 999px;
        padding: 4px 7px;
        background: rgba(33, 25, 18, 0.72);
        color: #ffffff;
        font-size: 12px;
        line-height: 1;
      }

      .annotation-layer {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
      }

      .text-box {
        position: absolute;
        min-width: 72px;
        min-height: 28px;
        border: 1px solid rgba(30, 64, 175, 0.55);
        border-radius: 4px;
        padding: 6px 8px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 4px 12px rgba(30, 41, 59, 0.18);
        pointer-events: auto;
        color: #111827;
        font-size: 14px;
        line-height: 1.35;
      }

      .drag-handle {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 12px;
        border-radius: 3px 0 0 3px;
        background: rgba(37, 99, 235, 0.55);
        cursor: move;
        touch-action: none;
        user-select: none;
      }

      .resize-handle {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 12px;
        height: 12px;
        border-right: 2px solid rgba(37, 99, 235, 0.85);
        border-bottom: 2px solid rgba(37, 99, 235, 0.85);
        cursor: nwse-resize;
        touch-action: none;
        user-select: none;
      }

      .delete-handle {
        position: absolute;
        top: 4px;
        right: 4px;
        z-index: 3;
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        border: 0;
        border-radius: 999px;
        padding: 0;
        background: rgba(220, 38, 38, 0.92);
        color: #ffffff;
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
        touch-action: none;
        user-select: none;
      }

      .delete-handle:hover {
        background: rgba(185, 28, 28, 0.96);
      }

      .text-box textarea {
        box-sizing: border-box;
        display: block;
        width: 100%;
        height: 100%;
        min-height: 100%;
        border: 0;
        padding: 6px 8px;
        background: transparent;
        color: #111827;
        font: inherit;
        font-size: 14px;
        line-height: 1.35;
        outline: 0;
      }

      .check-box {
        position: absolute;
        display: grid;
        place-items: center;
        border: 1px solid rgba(30, 64, 175, 0.55);
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.88);
        pointer-events: auto;
        box-shadow: 0 4px 12px rgba(30, 41, 59, 0.18);
        cursor: move;
        touch-action: none;
        user-select: none;
      }

      .check-box input {
        width: 65%;
        height: 65%;
        margin: 0;
        pointer-events: auto;
      }

      .text-create-preview {
        position: absolute;
        z-index: 6;
        border: 1px dashed rgba(37, 99, 235, 0.9);
        border-radius: 4px;
        background: rgba(37, 99, 235, 0.08);
        pointer-events: none;
      }

      .text-create-mode .page-surface {
        cursor: crosshair;
      }

      .loading {
        position: absolute;
        inset: 0;
        z-index: 15;
        display: grid;
        place-items: center;
        background: rgba(232, 225, 213, 0.76);
        color: #47382d;
        font-size: 14px;
      }

      .loading[hidden] {
        display: none;
      }

      .hint {
        color: #594a3d;
        font-size: 13px;
      }

      @media (max-width: 760px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        .toolbar {
          width: 100%;
          justify-content: space-between;
        }

        main {
          padding: 12px;
        }

        .stage {
          width: min(96vw, 720px);
          aspect-ratio: var(--page-ratio) / 1;
        }

        .spread {
          grid-template-columns: 1fr 1fr;
        }

        .gutter {
          display: none;
        }
      }

      @keyframes page-enter-front {
        from {
          opacity: 0;
          filter: brightness(1.08);
          transform: translateX(-14px) scale(1.035);
        }
        to {
          opacity: 1;
          filter: brightness(1);
          transform: translateX(0) scale(1);
        }
      }

      @keyframes page-enter-back {
        from {
          opacity: 0;
          filter: brightness(0.9);
          transform: translateX(14px) scale(0.965);
        }
        to {
          opacity: 1;
          filter: brightness(1);
          transform: translateX(0) scale(1);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Pamphlet.pdf</h1>
      <div class="toolbar" aria-label="&#12506;&#12540;&#12472;&#25805;&#20316;">
        <button id="prev" type="button" aria-label="&#21069;&#12398;&#12506;&#12540;&#12472;">&lt;</button>
        <div id="counter" class="counter" aria-live="polite"></div>
        <button id="next" type="button" aria-label="&#27425;&#12398;&#12506;&#12540;&#12472;">&gt;</button>
        <button id="addText" type="button">Text</button>
        <button id="addCheck" type="button">Check</button>
        <button id="exportAnnotations" type="button">Export</button>
        <a href="Pamphlet.pdf" target="_blank" rel="noopener">PDF&#12434;&#38283;&#12367;</a>
      </div>
    </header>

    <main>
      <section class="stage" aria-label="&#12497;&#12531;&#12501;&#12524;&#12483;&#12488;&#20874;&#23376;&#12499;&#12517;&#12540;">
        <div class="cover-board"></div>
        <div id="book" class="book"></div>
        <div id="loading" class="loading">Loading PDF...</div>
      </section>
    </main>

    <footer>
      <div class="hint">&#24038;&#21491;&#12461;&#12540;&#12391;&#12506;&#12540;&#12472;&#12434;&#12417;&#12367;&#12428;&#12414;&#12377;</div>
    </footer>

    <script type="module">
      import * as pdfjsLib from "./vendor/pdfjs/pdf.min.mjs";

      pdfjsLib.GlobalWorkerOptions.workerSrc = "./vendor/pdfjs/pdf.worker.min.mjs";

      const book = document.querySelector("#book");
      const prev = document.querySelector("#prev");
      const next = document.querySelector("#next");
      const addText = document.querySelector("#addText");
      const addCheck = document.querySelector("#addCheck");
      const exportAnnotations = document.querySelector("#exportAnnotations");
      const counter = document.querySelector("#counter");
      const loading = document.querySelector("#loading");
      const pageImages = new Map();
      const pageRenderPromises = new Map();
      const storageKey = "pamphlet-text-boxes-v1";
      let annotations = {};
      let spreads = [];
      let pdf;
      let current = 0;
      let totalPages = 0;
      let textCreateMode = false;

      function buildSpreads(total) {
        const result = [[1]];

        for (let page = 2; page < total; page += 2) {
          if (page + 1 < total) {
            result.push([page, page + 1]);
          } else {
            result.push([page]);
          }
        }

        if (total > 1) {
          result.push([total]);
        }

        return result;
      }

      function pageName(page) {
        if (page === 1) return "\u8868\u7d19";
        if (page === totalPages) return "\u88cf\u8868\u7d19";
        return `${page}\u30da\u30fc\u30b8`;
      }

      function createImage(page, src) {
        const image = document.createElement("img");
        image.src = src;
        image.alt = pageName(page);
        image.draggable = false;
        return image;
      }

      function createPageSurface(page) {
        const surface = document.createElement("div");
        surface.className = "page-surface";

        const readyImage = pageImages.get(page);
        if (readyImage) {
          surface.append(createImage(page, readyImage));
          return surface;
        }

        const loader = document.createElement("div");
        loader.className = "page-loading";
        loader.textContent = "Rendering...";
        surface.append(loader);

        ensurePageImage(page)
          .then((src) => {
            surface.textContent = "";
            surface.append(createImage(page, src));
          })
          .catch(() => {
            loader.textContent = "Render failed";
          });

        return surface;
      }

      function saveAnnotations() {
        localStorage.setItem(storageKey, JSON.stringify(annotations));
      }

      function exportAnnotationsFile() {
        const blob = new Blob([JSON.stringify(annotations, null, 2)], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "annotations.json";
        link.click();
        URL.revokeObjectURL(url);
      }

      function normalizeAnnotations(data) {
        return Object.fromEntries(
          Object.entries(data || {}).map(([page, items]) => [
            page,
            Array.isArray(items)
              ? items.map((item) => ({
                  ...item,
                  type: item.type || "text",
                }))
              : [],
          ])
        );
      }

      function pageAnnotations(page) {
        annotations[page] ||= [];
        return annotations[page];
      }

      function clampPercent(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function removeAnnotation(page, id) {
        const items = pageAnnotations(page);
        const index = items.findIndex((item) => item.id === id);
        if (index < 0) return;
        items.splice(index, 1);
        saveAnnotations();
        renderStatic();
      }

      function setTextCreateMode(active) {
        textCreateMode = active;
        addText.classList.toggle("active", active);
        addText.setAttribute("aria-pressed", String(active));
        document.body.classList.toggle("text-create-mode", active);
      }

      function addTextAnnotation(page, x = 18, y = 18) {
        pageAnnotations(page).push({
          id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
          type: "text",
          x,
          y,
          width: 26,
          height: 12,
          text: "",
        });
        saveAnnotations();
        renderStatic();
      }

      function addCheckAnnotation(page, x = 18, y = 18) {
        pageAnnotations(page).push({
          id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
          type: "check",
          x,
          y,
          width: 5,
          height: 5,
          checked: false,
        });
        saveAnnotations();
        renderStatic();
      }

      function addTextAnnotationAt(page, x, y, width, height) {
        pageAnnotations(page).push({
          id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
          type: "text",
          x,
          y,
          width,
          height,
          text: "",
        });
        saveAnnotations();
        renderStatic();
      }

      function renderAnnotationLayer(wrapper, page) {
        const layer = document.createElement("div");
        layer.className = "annotation-layer";

        pageAnnotations(page).forEach((item) => {
          if ((item.type || "text") === "check") {
            const checkBox = document.createElement("label");
            checkBox.className = "check-box";
            checkBox.style.left = `${item.x}%`;
            checkBox.style.top = `${item.y}%`;
            checkBox.style.width = `${item.width || 5}%`;
            checkBox.style.height = `${item.height || 5}%`;
            checkBox.dataset.id = item.id;

            const input = document.createElement("input");
            input.type = "checkbox";
            input.checked = !!item.checked;
            const resizeHandle = document.createElement("div");
            resizeHandle.className = "resize-handle";
            const deleteHandle = document.createElement("button");
            deleteHandle.className = "delete-handle";
            deleteHandle.type = "button";
            deleteHandle.setAttribute("aria-label", "削除");
            deleteHandle.textContent = "×";
            checkBox.append(input, resizeHandle, deleteHandle);

            input.addEventListener("change", () => {
              item.checked = input.checked;
              saveAnnotations();
            });

            deleteHandle.addEventListener("pointerdown", (event) => {
              event.preventDefault();
              event.stopPropagation();
            });

            deleteHandle.addEventListener("click", (event) => {
              event.preventDefault();
              event.stopPropagation();
              removeAnnotation(page, item.id);
            });

            checkBox.addEventListener("pointerdown", (event) => {
              if (event.target === input || event.target === resizeHandle || event.target === deleteHandle) return;
              event.preventDefault();
              event.stopPropagation();
              const rect = wrapper.getBoundingClientRect();
              const startX = event.clientX;
              const startY = event.clientY;
              const originalX = item.x;
              const originalY = item.y;

              function move(moveEvent) {
                const dx = ((moveEvent.clientX - startX) / rect.width) * 100;
                const dy = ((moveEvent.clientY - startY) / rect.height) * 100;
                item.x = clampPercent(originalX + dx, 0, 96);
                item.y = clampPercent(originalY + dy, 0, 96);
                checkBox.style.left = `${item.x}%`;
                checkBox.style.top = `${item.y}%`;
              }

              function stop() {
                saveAnnotations();
                window.removeEventListener("pointermove", move);
                window.removeEventListener("pointerup", stop);
              }

              window.addEventListener("pointermove", move);
              window.addEventListener("pointerup", stop);
            });

            resizeHandle.addEventListener("pointerdown", (event) => {
              event.preventDefault();
              event.stopPropagation();
              const rect = wrapper.getBoundingClientRect();
              const startX = event.clientX;
              const startY = event.clientY;
              const startWidth = ((item.width || 5) / 100) * rect.width;
              const startHeight = ((item.height || 5) / 100) * rect.height;

              function resize(moveEvent) {
                const nextWidthPx = Math.max(18, startWidth + moveEvent.clientX - startX);
                const nextHeightPx = Math.max(18, startHeight + moveEvent.clientY - startY);
                item.width = clampPercent((nextWidthPx / rect.width) * 100, 3, 24);
                item.height = clampPercent((nextHeightPx / rect.height) * 100, 3, 24);
                checkBox.style.width = `${item.width}%`;
                checkBox.style.height = `${item.height}%`;
              }

              function stopResize() {
                saveAnnotations();
                window.removeEventListener("pointermove", resize);
                window.removeEventListener("pointerup", stopResize);
              }

              window.addEventListener("pointermove", resize);
              window.addEventListener("pointerup", stopResize);
            });

            layer.append(checkBox);
            return;
          }

          const box = document.createElement("div");
          box.className = "text-box";
          box.style.left = `${item.x}%`;
          box.style.top = `${item.y}%`;
          box.style.width = `${item.width || 26}%`;
          box.style.height = `${item.height || 12}%`;
          box.dataset.id = item.id;
          const text = document.createElement("textarea");
          text.value = item.text;
          text.spellcheck = false;
          text.style.width = "100%";
          text.style.height = "100%";
          const resizeHandle = document.createElement("div");
          resizeHandle.className = "resize-handle";
          const dragHandle = document.createElement("div");
          dragHandle.className = "drag-handle";
          const deleteHandle = document.createElement("button");
          deleteHandle.className = "delete-handle";
          deleteHandle.type = "button";
          deleteHandle.setAttribute("aria-label", "削除");
          deleteHandle.textContent = "×";
          box.append(dragHandle, text, resizeHandle, deleteHandle);
          text.addEventListener("input", () => {
            item.text = text.value;
            saveAnnotations();
          });

          deleteHandle.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            event.stopPropagation();
          });

          deleteHandle.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopPropagation();
            removeAnnotation(page, item.id);
          });

          dragHandle.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            event.stopPropagation();
            const rect = wrapper.getBoundingClientRect();
            const startX = event.clientX;
            const startY = event.clientY;
            const originalX = item.x;
            const originalY = item.y;

            function move(moveEvent) {
              const dx = ((moveEvent.clientX - startX) / rect.width) * 100;
              const dy = ((moveEvent.clientY - startY) / rect.height) * 100;
              item.x = clampPercent(originalX + dx, 0, 92);
              item.y = clampPercent(originalY + dy, 0, 92);
              box.style.left = `${item.x}%`;
              box.style.top = `${item.y}%`;
            }

            function stop() {
              saveAnnotations();
              window.removeEventListener("pointermove", move);
              window.removeEventListener("pointerup", stop);
            }

            window.addEventListener("pointermove", move);
            window.addEventListener("pointerup", stop);
          });

          resizeHandle.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            event.stopPropagation();
            const rect = wrapper.getBoundingClientRect();
            const startX = event.clientX;
            const startY = event.clientY;
            const startWidth = ((item.width || 26) / 100) * rect.width;
            const startHeight = ((item.height || 12) / 100) * rect.height;

            function resize(moveEvent) {
              const nextWidthPx = Math.max(48, startWidth + moveEvent.clientX - startX);
              const nextHeightPx = Math.max(36, startHeight + moveEvent.clientY - startY);
              item.width = clampPercent((nextWidthPx / rect.width) * 100, 6, 96 - item.x);
              item.height = clampPercent((nextHeightPx / rect.height) * 100, 5, 96 - item.y);
              box.style.width = `${item.width}%`;
              box.style.height = `${item.height}%`;
            }

            function stopResize() {
              saveAnnotations();
              window.removeEventListener("pointermove", resize);
              window.removeEventListener("pointerup", stopResize);
            }

            window.addEventListener("pointermove", resize);
            window.addEventListener("pointerup", stopResize);
          });

          layer.append(box);
        });

        wrapper.append(layer);
      }

      function enableTextCreation(wrapper, page) {
        wrapper.addEventListener("pointerdown", (event) => {
          if (!textCreateMode) return;
          if (event.button !== 0) return;
          if (event.target.closest(".annotation-layer")) return;
          event.preventDefault();
          event.stopPropagation();

          const rect = wrapper.getBoundingClientRect();
          const startX = event.clientX;
          const startY = event.clientY;
          const startPercentX = ((startX - rect.left) / rect.width) * 100;
          const startPercentY = ((startY - rect.top) / rect.height) * 100;
          const preview = document.createElement("div");
          preview.className = "text-create-preview";
          wrapper.append(preview);

          function updatePreview(moveEvent) {
            const currentPercentX = ((moveEvent.clientX - rect.left) / rect.width) * 100;
            const currentPercentY = ((moveEvent.clientY - rect.top) / rect.height) * 100;
            const left = clampPercent(Math.min(startPercentX, currentPercentX), 0, 100);
            const top = clampPercent(Math.min(startPercentY, currentPercentY), 0, 100);
            const right = clampPercent(Math.max(startPercentX, currentPercentX), 0, 100);
            const bottom = clampPercent(Math.max(startPercentY, currentPercentY), 0, 100);
            preview.style.left = `${left}%`;
            preview.style.top = `${top}%`;
            preview.style.width = `${Math.max(1, right - left)}%`;
            preview.style.height = `${Math.max(1, bottom - top)}%`;
          }

          function finishCreate(moveEvent) {
            moveEvent.preventDefault();
            const endPercentX = ((moveEvent.clientX - rect.left) / rect.width) * 100;
            const endPercentY = ((moveEvent.clientY - rect.top) / rect.height) * 100;
            const left = clampPercent(Math.min(startPercentX, endPercentX), 0, 100);
            const top = clampPercent(Math.min(startPercentY, endPercentY), 0, 100);
            const right = clampPercent(Math.max(startPercentX, endPercentX), 0, 100);
            const bottom = clampPercent(Math.max(startPercentY, endPercentY), 0, 100);
            const width = Math.max(6, right - left);
            const height = Math.max(5, bottom - top);
            preview.remove();
            window.removeEventListener("pointermove", updatePreview);
            window.removeEventListener("pointerup", finishCreate);
            if (width < 1 || height < 1) {
              setTextCreateMode(false);
              return;
            }
            addTextAnnotationAt(page, left, top, width, height);
            setTextCreateMode(false);
          }

          window.addEventListener("pointermove", updatePreview);
          window.addEventListener("pointerup", finishCreate, { once: true });
          updatePreview(event);
        });
      }

      function createPage(page, side) {
        const wrapper = document.createElement("article");
        wrapper.className = `page ${side} ${side === "left" ? "edge-left" : "edge-right"}`;
        wrapper.dataset.page = page;
        wrapper.append(createPageSurface(page));

        const label = document.createElement("div");
        label.className = "page-label";
        label.textContent = pageName(page);
        wrapper.append(label);
        renderAnnotationLayer(wrapper, page);
        enableTextCreation(wrapper, page);
        return wrapper;
      }

      function createSpread(index, extraClass = "") {
        const pages = spreads[index];
        const spread = document.createElement("div");
        const coverClass = pages[0] === 1 ? " cover" : pages[0] === totalPages ? " back-cover" : "";
        spread.className = `spread${pages.length === 1 ? " single" : ""}${coverClass}${extraClass}`;

        if (pages.length === 1) {
          spread.append(createPage(pages[0], "single"));
        } else {
          spread.append(createPage(pages[0], "left"), createPage(pages[1], "right"));
          const gutter = document.createElement("div");
          gutter.className = "gutter";
          spread.append(gutter);
        }

        return spread;
      }

      function updateControls() {
        const pages = spreads[current];
        prev.disabled = current === 0;
        next.disabled = current === spreads.length - 1;
        counter.textContent = pages.length === 1 ? pageName(pages[0]) : `${pages[0]}-${pages[1]}\u30da\u30fc\u30b8`;
      }

      function renderStatic(direction = 0) {
        book.textContent = "";
        const animationClass = direction > 0 ? " enter-next" : direction < 0 ? " enter-prev" : "";
        book.append(createSpread(current, ` base${animationClass}`));
        updateControls();
      }

      function pagesForSpread(index) {
        return spreads[index] || [];
      }

      function ensureSpreadImages(index) {
        return Promise.all(pagesForSpread(index).map((page) => ensurePageImage(page)));
      }

      function turn(delta) {
        const target = Math.min(spreads.length - 1, Math.max(0, current + delta));
        if (target === current) return;

        const direction = delta > 0 ? 1 : -1;
        current = target;
        renderStatic(direction);
      }

      async function loadPdf() {
        const loadingTask = pdfjsLib.getDocument("Pamphlet.pdf");
        pdf = await loadingTask.promise;
        const total = pdf.numPages;
        totalPages = total;
        spreads = buildSpreads(total);

        const firstPage = await pdf.getPage(1);
        const viewport = firstPage.getViewport({ scale: 1 });
        const pageRatio = viewport.width / viewport.height;
        document.documentElement.style.setProperty("--page-ratio", pageRatio.toFixed(6));
        document.documentElement.style.setProperty("--spread-ratio", (pageRatio * 2).toFixed(6));
      }

      async function loadAnnotations() {
        const stored = normalizeAnnotations(JSON.parse(localStorage.getItem(storageKey) || "{}"));
        if (Object.keys(stored).length > 0) {
          annotations = stored;
          return;
        }

        try {
          const response = await fetch("./annotations.json", { cache: "no-store" });
          if (response.ok) {
            annotations = normalizeAnnotations(await response.json());
            localStorage.setItem(storageKey, JSON.stringify(annotations));
            return;
          }
        } catch (error) {
          console.warn("annotations.json could not be loaded", error);
        }

        annotations = stored;
      }

      function ensurePageImage(pageNumber) {
        if (pageImages.has(pageNumber)) {
          return Promise.resolve(pageImages.get(pageNumber));
        }

        if (pageRenderPromises.has(pageNumber)) {
          return pageRenderPromises.get(pageNumber);
        }

        const promise = (async () => {
          const page = await pdf.getPage(pageNumber);
          const viewport = page.getViewport({ scale: 1.6 });
          const canvas = document.createElement("canvas");
          const context = canvas.getContext("2d", { alpha: false });
          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);
          await page.render({ canvasContext: context, viewport }).promise;
          const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
          if (!blob) throw new Error(`Page ${pageNumber} image conversion failed.`);
          const url = URL.createObjectURL(blob);
          const image = new Image();
          image.src = url;
          await image.decode().catch(() => {});
          pageImages.set(pageNumber, url);
          return url;
        })();

        pageRenderPromises.set(pageNumber, promise);
        return promise;
      }

      async function preloadAllPages() {
        for (let pageNumber = 1; pageNumber <= totalPages; pageNumber++) {
          loading.textContent = `Rendering ${pageNumber} / ${totalPages}`;
          await ensurePageImage(pageNumber);
        }
      }

      prev.addEventListener("click", () => turn(-1));
      next.addEventListener("click", () => turn(1));
      addText.addEventListener("click", () => setTextCreateMode(!textCreateMode));
      addCheck.addEventListener("click", () => addCheckAnnotation(spreads[current][0]));
      exportAnnotations.addEventListener("click", exportAnnotationsFile);
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          setTextCreateMode(false);
          return;
        }
        if (document.activeElement?.tagName === "TEXTAREA") return;
        if (event.key === "ArrowLeft") turn(-1);
        if (event.key === "ArrowRight") turn(1);
      });

      try {
        await loadPdf();
        await loadAnnotations();
        await preloadAllPages();
        loading.hidden = true;
        renderStatic();
      } catch (error) {
        loading.textContent = "PDF could not be loaded. Please open this page through the local server.";
        console.error(error);
      }
    </script>
  </body>
</html>
